<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- GLACIER stratified-diamond mark, from the design system.
       fill="none" is repeated on each path because Material sets
       `fill: currentColor` on the inlined logo, which overrides the
       attribute on the root <svg> but not the ones on the paths. -->
  <path d="M6 24 L24 6 L42 24 L24 42 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"></path>
  <path d="M6 24 L24 14 L42 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"></path>
  <path d="M14 29 L24 24 L34 29" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>
</svg>
