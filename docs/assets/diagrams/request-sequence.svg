<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A control component and a machine each register with a FrostLink, which answers each registration. The control component then sends a METHOD INVOKE to the link, the link forwards it to the machine, the machine runs the node's callback, and a METHOD COMPLETED response travels back through the link to the control component.">
  <defs>
    <marker id="s-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--d-line, #cdc6b3)"/>
    </marker>
    <marker id="s-arrow-a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--d-accent, #1a5fd9)"/>
    </marker>
  </defs>
  <g stroke="var(--d-line, #cdc6b3)" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="110" y1="66" x2="110" y2="386"/>
    <line x1="380" y1="66" x2="380" y2="386"/>
    <line x1="650" y1="66" x2="650" y2="386"/>
  </g>
  <g stroke="var(--d-line, #cdc6b3)" stroke-width="1.5" fill="var(--d-fill, #ffffff)">
    <rect x="20" y="14" width="180" height="52" rx="8"/>
    <rect x="300" y="14" width="160" height="52" rx="8"/>
    <rect x="560" y="14" width="180" height="52" rx="8"/>
  </g>
  <g text-anchor="middle" font-family="inherit" fill="var(--d-ink, #14110d)" font-size="14.5" font-weight="500">
    <text x="110" y="36">Control component</text>
    <text x="380" y="45">FrostLink</text>
    <text x="650" y="36">Machine</text>
  </g>
  <g text-anchor="middle" font-family="inherit" fill="var(--d-muted, #80766a)" font-size="12">
    <text x="110" y="54">FrostReactor</text>
    <text x="650" y="54">FrostReactor</text>
  </g>
  <g stroke="var(--d-line, #cdc6b3)" stroke-width="1.5" marker-end="url(#s-arrow)">
    <line x1="110" y1="104" x2="374" y2="104"/>
    <line x1="380" y1="134" x2="116" y2="134" stroke-dasharray="5 4"/>
    <line x1="650" y1="164" x2="386" y2="164"/>
    <line x1="380" y1="194" x2="644" y2="194" stroke-dasharray="5 4"/>
  </g>
  <g font-family="inherit" fill="var(--d-muted, #80766a)" font-size="12.5" text-anchor="middle">
    <text x="245" y="98">PROTOCOL / REGISTER</text>
    <text x="245" y="128">PROTOCOL / REGISTER  (response)</text>
    <text x="515" y="158">PROTOCOL / REGISTER</text>
    <text x="515" y="188">PROTOCOL / REGISTER  (response)</text>
  </g>
  <line x1="20" y1="216" x2="740" y2="216" stroke="var(--d-line, #cdc6b3)" stroke-width="1" stroke-dasharray="2 5"/>
  <g stroke="var(--d-accent, #1a5fd9)" stroke-width="1.8" marker-end="url(#s-arrow-a)">
    <line x1="110" y1="252" x2="374" y2="252"/>
    <line x1="380" y1="286" x2="644" y2="286"/>
    <line x1="650" y1="344" x2="386" y2="344"/>
    <line x1="380" y1="374" x2="116" y2="374"/>
  </g>
  <g font-family="inherit" fill="var(--d-accent, #1a5fd9)" font-size="12.5" text-anchor="middle" font-weight="500">
    <text x="245" y="246">METHOD / INVOKE</text>
    <text x="515" y="280">METHOD / INVOKE</text>
    <text x="515" y="338">METHOD / COMPLETED</text>
    <text x="245" y="368">METHOD / COMPLETED</text>
  </g>
  <rect x="596" y="300" width="128" height="28" rx="6"
        fill="var(--d-fill, #ffffff)" stroke="var(--d-line, #cdc6b3)" stroke-width="1.4"/>
  <text x="660" y="318" text-anchor="middle" font-family="inherit"
        fill="var(--d-muted, #80766a)" font-size="12">runs the callback</text>
</svg>
